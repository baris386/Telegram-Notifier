<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifier Bot Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <div class="card calendar-card">
            <div class="today-box">
                <span id="today-day">26</span>
                <div class="today-details">
                    <span id="today-month-year">July 2026</span>
                    <span id="today-weekday">Sunday</span>
                </div>
            </div>

            <hr class="divider">

            <div class="mini-calendar">
                <div class="calendar-header">
                    <span id="calendar-month-year">July 2026</span>
                </div>
                <div class="calendar-weekdays">
                    <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
                </div>
                <div class="calendar-days" id="calendar-days">
                </div>
            </div>
        </div>
        
        <div class="card add-card">
            <form id="add-form" action="/add" method="POST">
                <label>Title</label>
                <input type="text" name="notification_name" placeholder="Notification name" required>

                <label>Message</label>
                <textarea name="notification_message" placeholder="Message..." rows="3" required></textarea>

                <label>Date</label>
                <input type="date" name="notification_date" required>

                <label>Time</label>
                <input type="time" name="notification_time" required>

                <button type="submit" class="save-btn">Add</button>
            </form>
        </div>

        <div class="card notifications-card"></div>
    </div>

    <div id="edit-modal" class="modal" style="display: none;" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-labelledby="edit-modal-title">
            <span class="close-btn" onclick="closeEditModal()" aria-label="Close">&times;</span>
            <h3 id="edit-modal-title">Edit Notification</h3>

            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <input type="hidden" id="edit-status">

                <label>Title</label>
                <input type="text" id="edit-name" required>

                <label>Message:</label>
                <textarea id="edit-message" rows="3" required></textarea>

                <label>Date:</label>
                <input type="date" id="edit-date" required>

                <label>Time:</label>
                <input type="time" id="edit-time" required>

                <button type="submit" class="save-btn">Save</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
